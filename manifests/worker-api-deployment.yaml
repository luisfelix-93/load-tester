apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-api
spec:
  selector:
    matchLabels:
      app: worker-api
  template:
    metadata:
      labels:
        app: worker-api
    spec:
      containers:
      - name: worker-api
        image: luisffilho/health-check-worker:20250829
        ports:
        - containerPort: 3001
        env:
        - name: REDIS_HOST
          value: "redis-svc"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"