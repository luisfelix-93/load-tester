apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-api
spec:
  selector:
    matchLabels:
      app: loadtest-api
  template:
    metadata:
      labels:
        app: loadtest-api
    spec:
      containers:
      - name: loadtest-api
        image: luisffilho/load-tester-api:latest
        ports:
        - containerPort: 4000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
