version: '3.8'
services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - loadtest-net
  
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - loadtest-net

  loadtest-api:
    image: luisffilho/load-tester-api:latest
    environment:
      - API_PORT=4000
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - MONGODB_URI=mongodb://mongo:27017/load-tester-db
    ports:
      - "4000:4000"
    networks:
      - loadtest-net

  loadtest-worker:
    image: luisffilho/load-tester-worker:latest
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
    networks:
      - loadtest-net

  loadtest-app:
    image: luisffilho/load-tester-app:latest
    ports:
      - "5173:5173"
    networks:
      - loadtest-net

  orchestrator-api:
    image: luisffilho/health-check-api:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/health-check-db
      - REDIS_ROST=redis
      - REDIS_PORT=6379
      - CRON_SCHEDULE='*/1 * * * *'
    networks:
      - loadtest-net

  worker-api:
    image: luisffilho/health-check-worker:latest
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
    ports:
      - '3001:3001'
    networks:
      - loadtest-net

networks:
  loadtest-net:
    driver: overlay